<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes pmPulse{0%,100%{opacity:.12}50%{opacity:.4}}
</style>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;width:100%;height:100%;min-height:180px;background:var(--cnv);border:1px solid var(--ln);border-radius:var(--rs);overflow:hidden;box-shadow:var(--glow)">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--ac) 7%,transparent),transparent 60%);pointer-events:none"></div>

  <svg viewBox="{{ vb }}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;display:block">
    {{ content }}
  </svg>

  <div style="position:absolute;left:11px;top:9px;display:flex;flex-direction:column;gap:3px;pointer-events:none">
    <div style="font:700 9px var(--fm);letter-spacing:.18em;color:var(--ac);text-transform:uppercase">{{ map.label }}</div>
    <div style="font:500 9.5px var(--f);color:var(--mut);max-width:280px">{{ map.sub }}</div>
  </div>

  <div style="position:absolute;right:11px;top:9px;display:flex;align-items:center;gap:8px;pointer-events:none">
    <sc-for list="{{ map.legend }}" as="g" hint-placeholder-count="4">
      <span style="display:inline-flex;align-items:center;gap:4px;font:600 8.5px var(--fm);color:var(--mut);letter-spacing:.06em">
        <sc-if value="{{ g.solid }}" hint-placeholder-val="{{ true }}"><span style="width:8px;height:8px;border-radius:50%;background:{{ g.c }}"></span></sc-if>
        <sc-if value="{{ g.hollow }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;border:1.3px solid {{ g.c }};background:transparent"></span></sc-if>
        {{ g.n }}
      </span>
    </sc-for>
  </div>

  <div style="position:absolute;right:11px;bottom:8px;font:600 8.5px var(--fm);color:var(--mut);letter-spacing:.1em;pointer-events:none">{{ map.coord }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:940,&quot;height&quot;:380},&quot;map&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hover: null, W: 0, H: 0 }; this.rootRef = React.createRef(); }
  componentDidMount() { this.measure(); try { this._ro = new ResizeObserver(() => this.measure()); if (this.rootRef.current) this._ro.observe(this.rootRef.current); } catch (e) { window.addEventListener('resize', this._rz = () => this.measure()); } }
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); if (this._rz) window.removeEventListener('resize', this._rz); }
  measure() { const el = this.rootRef.current; if (!el) return; const w = el.clientWidth, h = el.clientHeight; if (w && h && (w !== this.state.W || h !== this.state.H)) this.setState({ W: w, H: h }); }

  renderVals() {
    const R = React.createElement;
    const m = this.props.map || {};
    const legend = [{ c: 'var(--ok)', n: 'ON TRACK', solid: true }, { c: 'var(--wa)', n: 'WATCH', solid: true }, { c: 'var(--bd)', n: 'BEHIND', solid: true }, { c: 'var(--mut)', n: 'NO WORK', hollow: true }];
    const W = this.state.W, H = this.state.H;
    const overlays = { label: m.label, sub: m.sub, coord: m.coord, legend };
    if (!W || !H) return { content: null, vb: '0 0 10 10', rootRef: this.rootRef, map: overlays };

    const NW = 1000, NH = 600; const fit = Math.min(W / NW, H / NH);
    const proj = (lon, lat) => { const bx = (lon + 125) / 59 * NW, by = (49.7 - lat) / 25.4 * NH; return [(bx - NW / 2) * fit + W / 2, (by - NH / 2) * fit + H / 2]; };
    const centers = m.centers || [], counts = m.counts || {}, sel = m.sel || [], focus = m.focus || []; const selSet = new Set(sel);

    let Z = 1, panX = 0, panY = 0;
    const fp = focus.map(code => centers.find(c => c.code === code)).filter(Boolean).map(c => proj(c.lon, c.lat));
    if (fp.length === 1) { Z = m.zoom || 2.7; panX = W / 2 - Z * fp[0][0]; panY = H / 2 - Z * fp[0][1]; }
    else if (fp.length > 1) {
      const xs = fp.map(p => p[0]), ys = fp.map(p => p[1]); const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
      const bw = Math.max(maxx - minx, 20) + W * 0.3, bh = Math.max(maxy - miny, 20) + H * 0.3; Z = Math.max(1, Math.min(W / bw, H / bh, 3.4));
      const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2; panX = W / 2 - Z * cx; panY = H / 2 - Z * cy;
    }
    const iz = 1 / Z; const els = [];

    for (let lon = -120; lon <= -70; lon += 10) { const a = proj(lon, 50), b = proj(lon, 24); els.push(R('line', { key: 'gx' + lon, x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: 'var(--cgrid)', strokeWidth: 0.6, vectorEffect: 'non-scaling-stroke' })); }
    for (let lat = 25; lat <= 45; lat += 5) { const a = proj(-125, lat), b = proj(-66, lat); els.push(R('line', { key: 'gy' + lat, x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: 'var(--cgrid)', strokeWidth: 0.6, vectorEffect: 'non-scaling-stroke' })); }

    const outline = m.outline || [];
    if (outline.length) { const d = 'M' + outline.map(p => { const q = proj(p[0], p[1]); return q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' L') + ' Z'; els.push(R('path', { key: 'pa', d: d, fill: 'color-mix(in srgb,var(--pn2) 82%,transparent)', stroke: 'color-mix(in srgb,var(--ac) 38%,var(--ln))', strokeWidth: 1.4, strokeLinejoin: 'round', vectorEffect: 'non-scaling-stroke' })); }

    centers.forEach((c, i) => {
      const info = counts[c.code]; const has = !!info; const n = has ? info.n : 0; const p = proj(c.lon, c.lat), x = p[0], y = p[1];
      const health = has ? info.health : 'none'; const base = health === 'red' ? 'var(--bd)' : health === 'amber' ? 'var(--wa)' : health === 'green' ? 'var(--ok)' : 'var(--mut)';
      const dim = focus.length > 0 && !selSet.has(c.code); const rpx = has ? 6 + Math.min(n, 6) : 5; const r = rpx * iz;
      const side = x > W * 0.82 ? 'left' : 'right'; const fs = +(13 * iz).toFixed(2); const o = (rpx + 5) * iz;
      const kids = [];
      if (has && selSet.has(c.code)) { kids.push(R('circle', { key: 'ra', cx: x, cy: y, r: (rpx + 9) * iz, fill: 'var(--ac)', style: { animation: 'pmPulse 2.2s ease-in-out infinite' } })); kids.push(R('circle', { key: 'rb', cx: x, cy: y, r: (rpx + 4) * iz, fill: 'none', stroke: 'var(--ac)', strokeWidth: 1, vectorEffect: 'non-scaling-stroke', opacity: 0.6 })); }
      kids.push(R('circle', { key: 'c', cx: x, cy: y, r: r, fill: !has ? 'var(--cnv)' : dim ? 'color-mix(in srgb,' + base + ' 40%,transparent)' : base, stroke: !has ? 'var(--mut)' : 'var(--cnv)', strokeWidth: !has ? 1.2 : 1.5, vectorEffect: 'non-scaling-stroke' }));
      kids.push(R('text', { key: 't', x: side === 'left' ? x - o - 3 * iz : x + o + 3 * iz, y: y + fs * 0.34, textAnchor: side === 'left' ? 'end' : 'start', paintOrder: 'stroke', stroke: 'var(--cnv)', strokeWidth: 3, strokeLinejoin: 'round', vectorEffect: 'non-scaling-stroke', style: { font: '800 ' + fs + 'px var(--fm)', fill: (dim || !has) ? 'var(--mut)' : 'var(--ink)', letterSpacing: '.02em' } }, c.code));
      els.push(R('g', { key: 'd' + i, style: { cursor: has ? 'pointer' : 'default' }, onClick: has && m.onToggle ? () => m.onToggle(c.code) : null, onMouseEnter: () => this.setState({ hover: c.code }), onMouseLeave: () => this.setState({ hover: null }) }, kids));
    });

    const hc = this.state.hover; const hCenter = hc ? centers.find(c => c.code === hc) : null;
    if (hCenter) {
      const info = counts[hCenter.code]; const n = info ? info.n : 0; const p = proj(hCenter.lon, hCenter.lat), x = p[0], y = p[1];
      const fs1 = +(13 * iz).toFixed(2), fs2 = +(10.5 * iz).toFixed(2); const name = hCenter.name;
      const sub = info ? (n + ' program' + (n === 1 ? '' : 's') + ' \u00b7 ' + hCenter.city) : ('No program work \u00b7 ' + hCenter.city);
      const maxLen = Math.max(name.length, sub.length); const bw = maxLen * fs1 * 0.56 + 16 * iz; const bh = fs1 + fs2 + 17 * iz;
      let bx = x - bw / 2; bx = Math.max(2, Math.min(W - bw - 2, bx)); let by = y - bh - 12 * iz; if (by < 4) by = y + 14 * iz;
      els.push(R('g', { key: 'tip', style: { pointerEvents: 'none' } }, [
        R('rect', { key: 'r', x: bx, y: by, width: bw, height: bh, rx: 4 * iz, fill: 'var(--pn)', stroke: 'var(--ac)', strokeWidth: 1.25, vectorEffect: 'non-scaling-stroke' }),
        R('text', { key: 'n', x: bx + 8 * iz, y: by + fs1 + 5 * iz, style: { font: '700 ' + fs1 + 'px var(--fd)', fill: 'var(--ink)' } }, name),
        R('text', { key: 's', x: bx + 8 * iz, y: by + fs1 + fs2 + 9 * iz, style: { font: '500 ' + fs2 + 'px var(--f)', fill: 'var(--mut)' } }, sub)
      ]));
    }

    const zoomG = R('g', { key: 'z', style: { transform: 'translate(' + panX.toFixed(1) + 'px,' + panY.toFixed(1) + 'px) scale(' + Z.toFixed(3) + ')', transformOrigin: '0 0', transition: 'transform 1.2s cubic-bezier(.65,0,.2,1)' } }, els);
    const cross = [R('line', { key: 'cv', x1: W / 2, y1: 0, x2: W / 2, y2: H, stroke: 'var(--cgrid)', strokeWidth: 0.5, opacity: 0.32 }), R('line', { key: 'ch', x1: 0, y1: H / 2, x2: W, y2: H / 2, stroke: 'var(--cgrid)', strokeWidth: 0.5, opacity: 0.32 })];
    return { content: [zoomG, cross[0], cross[1]], vb: '0 0 ' + W + ' ' + H, rootRef: this.rootRef, map: overlays };
  }
}
</script>
</body>
</html>
