<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;min-height:0;display:flex;flex-direction:column;background:var(--pn,#0E1522);border:1px solid var(--ln,#203049);border-radius:var(--r,10px);overflow:hidden">
  <div style="flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding:9px 13px 8px;border-bottom:1px solid var(--ln,#203049)">
    <span style="font:700 8px var(--fm,ui-monospace,monospace);letter-spacing:.14em;color:var(--mut,#8295AB);text-transform:uppercase;white-space:nowrap">{{ label }}</span>
    <span style="font:600 9px var(--fm,ui-monospace,monospace);color:var(--mut,#8295AB);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ sub }}</span>
    <span style="margin-left:auto;font:600 9px var(--fm,ui-monospace,monospace);color:var(--ac,#4AA3FF);letter-spacing:.08em;white-space:nowrap">{{ coord }}</span>
  </div>
  <div style="flex:1 1 auto;min-height:0;position:relative;background:var(--cnv,#0B1220)">
    {{ mapSvg }}
    <div style="position:absolute;left:10px;bottom:8px;font:600 8px var(--fm,ui-monospace,monospace);letter-spacing:.1em;color:var(--mut,#8295AB);opacity:.75;pointer-events:none">CLICK A CENTER TO FOCUS · CLICK AGAIN TO RELEASE</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1150,&quot;height&quot;:440},&quot;map&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{ gStyle: string; grat: {x1:string;y1:string;x2:string;y2:string}[]; path: string; dots: any[]; inv: number; outlineW: number; label: string; sub: string; coord: string }&quot;}}">
class Component extends DCLogic {
  /* SVG built via createElement: this runtime wraps template text holes in HTML <span>s,
     which are invisible inside SVG <text> — so the whole SVG layer is composed here. */
  styleObj(css) {
    const o = {};
    String(css || '').split(';').forEach(rule => {
      const i = rule.indexOf(':'); if (i < 0) return;
      const k = rule.slice(0, i).trim(), v = rule.slice(i + 1).trim(); if (!k) return;
      o[k.replace(/-([a-z])/g, (m, c) => c.toUpperCase())] = v;
    });
    return o;
  }
  renderVals() {
    const h = React.createElement, m = this.props.map || {};
    const grat = (m.grat || []).map((g, i) => h('line', { key: 'g' + i, x1: g.x1, y1: g.y1, x2: g.x2, y2: g.y2, stroke: 'var(--cgrid,rgba(130,149,171,.16))', strokeWidth: m.inv || 1 }));
    const dots = (m.dots || []).map((d, i) => h('g', { key: d.code || i, onClick: d.on, style: { cursor: 'pointer' } },
      h('title', null, d.name + ' · ' + d.sub),
      h('circle', { cx: d.x, cy: d.y, r: d.ring, fill: 'none', stroke: d.fill, strokeWidth: m.inv || 1, opacity: d.ringO }),
      h('circle', { cx: d.x, cy: d.y, r: d.r, fill: d.fill, stroke: d.stroke, strokeWidth: d.strokeW }),
      h('text', {
        x: d.tx, y: d.ty, textAnchor: d.anchor, fontSize: d.fs,
        style: { fontFamily: 'var(--fm,ui-monospace,monospace)', fontWeight: 700, letterSpacing: '.06em', fill: d.tc, paintOrder: 'stroke', stroke: 'var(--cnv,#0B1220)', strokeWidth: (d.halo || 2) + 'px' }
      }, d.code)));
    const mapSvg = h('svg', { viewBox: '0 0 1000 620', preserveAspectRatio: 'xMidYMid meet', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', display: 'block' } },
      h('g', { style: this.styleObj(m.gStyle) },
        grat,
        h('path', { d: m.path || '', fill: 'rgba(74,163,255,.045)', stroke: 'var(--ln,#203049)', strokeWidth: m.outlineW || 1.4, strokeLinejoin: 'round' }),
        dots));
    return { mapSvg, label: m.label || 'FIELD CENTER MAP', sub: m.sub || '', coord: m.coord || '' };
  }
}
</script>
</body>
</html>
