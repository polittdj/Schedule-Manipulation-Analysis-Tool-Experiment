# pyproject.toml — project definition + QC toolchain (§7)
#
# Real project definition so the package resolves, tooling (ruff/mypy/pytest/
# coverage/bandit) has a home, and `pip install -e '.[dev]'` works. The full
# QC/PM toolchain is wired into CI from milestone M1 (.github/workflows/ci.yml).
# Runtime dependencies are added per build milestone (see docs/PLAN/BUILD-PLAN.md).
#
# CUI guardrail: do NOT add any cloud/remote-HTTP client to `dependencies` without
# an explicit ADR — the egress guard (src/schedule_forensics/net_guard.py, tested
# by tests/guards/test_egress.py) fails CI if a forbidden distribution lands in the
# runtime dependency set.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-forensics"
version = "1.0.192"
description = "Local, NASA-themed forensic schedule-analysis tool (CUI-safe, offline)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — see LICENSE (placeholder)" }
authors = [{ name = "Schedule Forensics build" }]
keywords = ["scheduling", "cpm", "forensic", "dcma", "acumen", "nasa", "cui"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

# Runtime dependencies (added per milestone in Phase 2). pydantic powers the frozen,
# strict, UniqueID-keyed domain model (M2). The M13 web layer adds FastAPI + Jinja2 + a
# bare uvicorn server. CUI guardrail: NONE of these pull a forbidden HTTP client into the
# runtime — uvicorn is the plain build (NOT uvicorn[standard], which would add the
# forbidden `websockets` distribution); the server is inbound/local-only and binds to
# 127.0.0.1. The egress guard (net_guard.py) stays green (no requests/httpx/urllib3/
# websockets/aiohttp runtime dep, no importable cloud SDK).
#
# BOUNDS (ADR-0346). Every requirement below carries an upper bound as well as a lower one, and
# every lower bound is pinned in `constraints/floor.txt` and EXECUTED by CI's `floor` job. Before
# that, nothing bounded the resolution and nothing tested the bottom of it, so the same tree passed
# or failed on whatever pip resolved that day (measured: pytest 8.0.2 fail / 8.4.2 fail / 9.1.1
# pass on one commit, ADR-0345). `tests/test_dependency_bounds.py` keeps this true.
dependencies = [
  # 2.6 is a MEASURED floor, not a guess: 2.0.0/2.0.1/2.1.0 are excluded by fastapi 0.110 itself
  # (the declared pair was unsatisfiable), and 2.0.2-2.5.3 fail
  # tests/model/test_schedule.py::test_cache_does_not_perturb_hash_or_equality — pydantic's
  # generated `hash_func` hashed `self.__dict__.values()`, which on a frozen `Schedule` includes
  # the `tasks_by_id` cache: `TypeError: unhashable type: 'mappingproxy'`.
  "pydantic>=2.6,<3",
  # `<1` on the two 0.x web deps: a 1.0 from either is a deliberate breaking release, and fastapi
  # is what pulls starlette — whose TestClient is mid-transition from `httpx` to `httpx2` and will
  # RuntimeError once the fallback is dropped (see constraints/known-good.txt).
  #
  # >=0.110.2 IS A LAW 1 FLOOR, found by running the floor for the first time. fastapi 0.110.0 and
  # 0.110.1 serialize a `RequestValidationError` with pydantic's `url` key intact, so a 422 body
  # carries `https://errors.pydantic.dev/<ver>/v/missing` — an EXTERNAL reference served by the
  # air-gapped tool. `tests/web/test_airgap.py::test_every_get_route_serves_no_external_reference`
  # fails on 10 routes at 0.110.0/0.110.1 and passes from 0.110.2 on. Isolated to fastapi, not
  # pydantic: 0.110.0 leaks under pydantic 2.6.0 AND 2.13.4; 0.110.2+ is clean under both. Mechanism
  # confirmed by diffing the two wheels, not inferred: `fastapi/_compat.py` changed `exc.errors()`
  # to `exc.errors(include_url=False)` in 0.110.2 — that keyword IS the fix, and it is absent below.
  # The old `>=0.110` therefore DECLARED SUPPORT FOR AN AIR-GAP VIOLATION for a year — nothing
  # caught it because nothing ever installed the bottom of the range.
  "fastapi>=0.110.2,<1",
  "uvicorn>=0.29,<1",
  # floors at the patched releases (audit ADR-0250) so a constraints-pinned / offline-mirror install
  # cannot resolve a published-CVE version below what pip-audit would catch: jinja2 < 3.1.6
  # (CVE-2024-56201/56326, CVE-2025-27516 sandbox escapes), python-multipart < 0.0.18
  # (CVE-2024-53981 multipart-boundary DoS). Matches the setuptools>=83.0.0 remediation posture.
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.18,<1",
]

[project.urls]
Repository = "https://github.com/polittdj/schedule-manipulation-analysis-tool-experiment"
Documentation = "https://github.com/polittdj/schedule-manipulation-analysis-tool-experiment/tree/main/docs"

[project.scripts]
# One-command launcher: starts the local dashboard on 127.0.0.1 and opens the browser.
schedule-forensics = "schedule_forensics.launcher:main"
schedule-forensics-report = "schedule_forensics.exhibits.cli:main"

[project.optional-dependencies]
# live HUD telemetry enhancer (CPU%/temps on Windows/macOS); LOCAL reads only — never network
monitor = ["psutil>=5.9,<8"]
# The measured-box proof (ADR-0304/0305, standing requirement 2). DEV-ONLY, and deliberately its
# OWN extra rather than part of `dev`: it pulls a ~150 MB browser, so the Python matrix stays lean
# and only the dedicated `browser` CI job installs it. It is never a runtime dependency — the
# shipped tool stays std-lib-only for I/O (Law 1) and the egress guard covers `dependencies`, not
# this. Without it `tests/web/test_r11_panel_contract.py`'s rect assertions `importorskip`-SKIP,
# which is how a re-inerted ⛶ measured green for a whole round.
browser = ["playwright>=1.44,<2"]

# Quality/PM toolchain required by §7 (QC/PM regime).
#
# TWO KINDS OF LOWER BOUND HERE, and the difference is the honest part (ADR-0346).
#   * EXECUTED floors — pytest, pytest-cov, httpx. Pinned in `constraints/floor.txt` and actually
#     run by CI's `floor` job, so `minversion = "8.0"` below is a measurement.
#   * ADVISORY floors — ruff, mypy, bandit, pip-audit, setuptools. These are absent from the floor
#     file on purpose: their OUTPUT is version-sensitive by design, so running the gate against an
#     old one measures the tool rather than the product. They get a narrow declared RANGE instead.
# `tests/test_dependency_bounds.py` enforces both halves and the split.
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  # NARROW ON PURPOSE. `ruff format --check` is part of the gate and its output changes across
  # minors — this repo already paid for that once: ruff 0.16 began formatting fenced ```python
  # blocks inside Markdown, which is why `[tool.ruff.format] exclude = ["audit/*.md"]` exists a few
  # lines below. An unbounded `ruff>=0.6` means a new minor can turn CI red on a tree nobody
  # touched, so the range is one minor series wide and bumped deliberately.
  "ruff>=0.16.1,<0.17",
  # `mypy --strict` gains checks between majors; the floor is raised to the major the gate is
  # actually run against rather than left at an untested `>=1.11`.
  "mypy>=2,<3",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  # httpx backs starlette's TestClient (web route tests). DEV-ONLY — it is a forbidden
  # *runtime* distribution (egress guard), so it must never enter `dependencies`.
  "httpx>=0.27,<1",
  # Build/dev tool only (never a runtime dep — the shipped wheel is pure-Python and imports no
  # setuptools). Pinned to the patched release so CI's `pip-audit` on the `.[dev]` venv stays green:
  # setuptools < 83.0.0 carries PYSEC-2026-3447. This remediates the advisory (vs suppressing it) and
  # is the reviewed pin AUDIT-2026-07-13 called for when it flagged CI's ignore-list-less pip-audit as
  # a latent flake vector against `.[dev]` transitive deps.
  #
  # THE ONE DELIBERATE EXCEPTION to ADR-0346's upper-bound rule, and the reason is that a bound here
  # would work against the very thing the floor exists for. setuptools majors on a calendar cadence
  # and almost never breaks; a `<84` would demand a churn commit every few months, and — worse — an
  # upper bound is exactly what stops a future CVE remediation from resolving. The bound-everything
  # test carries this as a NAMED, documented exemption rather than letting it pass silently as an
  # oversight. (`build-system.requires` is exempt for the same reason and is a different resolver.)
  "setuptools>=83.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python runtime data the DEPLOYED tool serves/loads: the vendored JS/CSS (air-gapped UI)
# and the bundled example schedule. Without this the wheel installs but the app crashes at
# startup mounting /static — caught by the Linux installer's end-to-end run (2026-07-02); the
# dev environment never sees it because `pip install -e` reads the source tree. The installer
# smoke tests (Linux in-container + windows-latest CI) now exercise the WHEEL, keeping it honest.
[tool.setuptools.package-data]
schedule_forensics = ["web/static/*", "web/examples/*"]

# --- ruff: lint + format -------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The web view modules embed HTML/CSS string literals where an 80-100 col limit is
# meaningless; line-length is not enforced there (the logic stays readable regardless).
# `chrome.py` is app.py's page shell, extracted verbatim (ADR-0349) — the `_LAYOUT` skeleton
# and the nav/banner f-strings ARE the HTML, so the exemption travels with them. ADR-0297
# anticipated this: the split's HTML-carrying modules take the exemption; `state.py`, which
# has no HTML in it, still earns none.
"src/schedule_forensics/web/app.py" = ["E501"]
"src/schedule_forensics/web/chrome.py" = ["E501"]
# `components.py` is the shared presentation kernel, extracted verbatim from app.py (ADR-0350).
# Only ONE line actually needs the exemption — a `_metric_help_cell` docstring line that was
# already over-long inside app.py's exempt region. Re-wrapping it to earn a clean E501 would
# break the byte-for-byte property the whole extraction rests on, and verbatim outranks a rule
# that exists for code. The exemption travels with the code, exactly as it did for chrome.py.
"src/schedule_forensics/web/components.py" = ["E501"]
# `driving.py` is the /driving-path page family, extracted verbatim (ADR-0351). It carries the
# page's HTML f-strings, so the exemption travels with them exactly as it did for chrome.py.
"src/schedule_forensics/web/driving.py" = ["E501"]
# `evolution.py` is the /evolution page family, extracted verbatim (ADR-0352); it carries the
# page's HTML f-strings, so the exemption travels with them.
"src/schedule_forensics/web/evolution.py" = ["E501"]
# `portfolio.py` is the /portfolio page family, extracted verbatim (ADR-0375); one ledger-intro
# line was already over-long inside app.py's exempt region, and verbatim outranks re-wrapping.
"src/schedule_forensics/web/portfolio.py" = ["E501"]
# `forecast.py` is the /forecast page family, extracted verbatim (ADR-0374); it carries the
# page's HTML f-strings, so the exemption travels with them.
"src/schedule_forensics/web/forecast.py" = ["E501"]
# `integrity.py` is the /integrity page family, extracted verbatim (ADR-0358); it carries the
# page's HTML f-strings, so the exemption travels with them.
"src/schedule_forensics/web/integrity.py" = ["E501"]
# `margin.py` is the /margin page family, extracted verbatim (ADR-0363); it carries the
# page's HTML f-strings, so the exemption travels with them.
"src/schedule_forensics/web/margin.py" = ["E501"]
# `trend.py` is the /trend page family, extracted verbatim (ADR-0364); it carries the
# page's HTML f-strings, so the exemption travels with them.
"src/schedule_forensics/web/trend.py" = ["E501"]
# `ssi.py` is the SSI run machinery, extracted verbatim (ADR-0365). No HTML here — nine
# over-long COMMENT/docstring lines ride the verbatim rule: re-wrapping them to earn a clean
# E501 would break the byte-for-byte property the extraction rests on (the components.py
# precedent, one module later).
"src/schedule_forensics/web/ssi.py" = ["E501"]
# `mission.py` is the Mission Control wall body, extracted verbatim (ADR-0372); it carries the
# tiles' HTML f-strings and hover-hint one-liners, so the exemption travels with them.
"src/schedule_forensics/web/mission.py" = ["E501"]
# `scurve.py` is the /scurve page family, extracted verbatim (ADR-0380). Two interpretation
# strings (the "ahead of the baseline" read and the "narrowed by N points" trend clause) were
# already over-long inside app.py's exempt region; verbatim outranks re-wrapping.
"src/schedule_forensics/web/scurve.py" = ["E501"]
# `sra.py` is the /sra page family, extracted verbatim from app.py (ADR-0373) — the SSI panel,
# correlation/JCL panels, register sections and report blocks ARE HTML f-strings, so the
# exemption travels with them, exactly as it did for chrome/driving/evolution/integrity/
# margin/trend/ssi/mission.
"src/schedule_forensics/web/sra.py" = ["E501"]
# `analysis.py` is the /analysis page family, extracted verbatim (ADR-0376) — the report body,
# the chapter-01 header and the per-schedule panels ARE HTML f-strings, so the exemption
# travels with them.
"src/schedule_forensics/web/analysis.py" = ["E501"]
# `evm.py` is the /evm page family, extracted verbatim (ADR-0377) — the explainer/tip HTML
# and the dual-SPI(t) methodology text were already over-long inside app.py's exempt region,
# and verbatim outranks re-wrapping.
"src/schedule_forensics/web/evm.py" = ["E501"]
# `performance.py` is the /performance page family, extracted verbatim (ADR-0378) — the
# fourteen chart-mount tiles and their viz-hint one-liners ARE HTML f-strings, so the
# exemption travels with them.
"src/schedule_forensics/web/performance.py" = ["E501"]
# `path.py` is the /path page family, extracted verbatim (ADR-0381) — the workspace's control
# bar and SSI path-options block ARE HTML f-strings (several already over-long inside app.py's
# exempt region), so the exemption travels with them.
"src/schedule_forensics/web/path.py" = ["E501"]
# `compare.py` is the /compare page family, extracted verbatim (ADR-0382) — the version-trend
# and manipulation-signals tables ARE HTML f-strings (already over-long inside app.py's
# exempt region), so the exemption travels with them.
"src/schedule_forensics/web/compare.py" = ["E501"]
# `resources.py` is the /resources page family, extracted verbatim (ADR-0379) — the histogram
# and roster panels' prose and the explainer's `<p>` copy ARE HTML string literals, over-long
# inside app.py's exempt region already; the exemption travels with them.
"src/schedule_forensics/web/resources.py" = ["E501"]
# `risks.py` is the /risks page family, extracted verbatim (ADR-0383) — the risk-matrix
# caption and the AI-read block ARE HTML string literals, already over-long inside app.py's
# exempt region, so the exemption travels with them.
"src/schedule_forensics/web/risks.py" = ["E501"]
# `standards.py` is the /standards page family, extracted verbatim (ADR-0384) — the DCMA-14 and
# Fuse/SEM section notes ARE HTML string literals, already over-long inside app.py's exempt
# region, so the exemption travels with them.
"src/schedule_forensics/web/standards.py" = ["E501"]

[tool.ruff.format]
# ruff >= 0.16 formats fenced ```python blocks inside Markdown. That is right for prose docs and
# WRONG for the audit reports: those quote engine source and pasted script output VERBATIM, and a
# formatter rewriting a quotation silently makes the evidence disagree with the code it cites
# (e.g. it collapses dcma14's multi-line `status = (...)` — indented inside a function in the real
# file — into a 103-col one-liner that appears nowhere in the tree). A formatter must never edit
# evidence, so audit markdown is excluded. Everything else, including all other docs, still formats.
exclude = ["audit/*.md"]

# --- mypy: types ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# psutil is an OPTIONAL runtime enhancer (the [monitor] extra) — untyped and usually absent
# from the dev env; web/system.py degrades to stdlib collectors without it.
[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

# --- pytest + coverage ---------------------------------------------------------
[tool.pytest.ini_options]
# TESTED, not asserted (ADR-0346): `constraints/floor.txt` pins pytest==8.0.0 and CI's `floor` job
# runs the whole suite plus the parity gate against it. Raising this line without raising that pin
# (or vice versa) fails `tests/test_dependency_bounds.py`.
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "parity: Acumen Fuse v8.11.0 / SSI golden acceptance gate (§6.B) over the committed golden fixtures (tests/parity/).",
]
filterwarnings = [
  # starlette's TestClient still imports httpx; the deprecation is upstream, not ours.
  #
  # SILENCING IS NOT BOUNDING — that was the audit's point, and this line on its own was the whole
  # of our answer to the httpx→httpx2 transition. It stays (the warning really is upstream and
  # unactionable in the shipped product, which imports neither), but the transition is now bounded
  # where a bound belongs: `fastapi<1` in `dependencies` gates the starlette that carries the
  # fallback, and `constraints/known-good.txt` pins starlette itself with the mechanism written out.
  # starlette is deliberately NOT a declared dependency — nothing under `src/` imports it.
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["schedule_forensics"]

[tool.coverage.report]
show_missing = true
# Coverage gates (§7) are enforced in CI: overall >= 70 (`pytest --cov-fail-under=70`) and
# engine >= 85 (`coverage report --include='*/engine/*' --fail-under=85`); see
# .github/workflows/ci.yml. This `fail_under` matches the CI overall gate and only takes
# effect when coverage is collected (CI passes `--cov`; the default local `pytest` does not,
# so a local run does not gate coverage). Actual coverage runs well above this floor.
fail_under = 70.0
precision = 2

# --- bandit: security ----------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "tools"]
