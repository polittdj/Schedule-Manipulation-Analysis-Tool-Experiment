name: CI

# Real QC/PM pipeline (AUTONOMOUS-BUILD-PROMPT.md §7), stood up in milestone M1.
# Lint + format + types (strict) + tests + coverage gates + security on every push
# and PR; a red run blocks merge. The status-check context names are kept identical
# to the prior greenfield placeholder (`test (3.11)`, `test (3.13)`, `check`) so
# branch protection stays satisfied without reconfiguration.
#
# This pipeline is Python-only by design at M1 (no schedule logic yet). The JDK /
# MPXJ native-`.mpp` jobs are added when ingestion lands (M4); Ollama is never
# required in CI (local-only, §6.F).

on:
  # Push runs only on main; branch pushes are covered by their pull_request run (which also
  # carries the branch-protection contexts), so a PR push no longer triggers the matrix twice.
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (package + dev toolchain)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy, strict)
        run: mypy

      - name: Tests + overall coverage gate (>=70%)
        run: pytest --cov=schedule_forensics --cov-report=term-missing --cov-fail-under=70

      - name: Engine coverage gate (>=85%)
        run: coverage report --include='*/schedule_forensics/engine/*' --fail-under=85

      - name: Parity gate (Acumen Fuse v8.11.0 + SSI golden, §6.B)
        run: pytest -m parity -p no:cacheprovider

      - name: Security (bandit)
        run: bandit -q -r src

      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner=off

  # The MEASURED-BOX proof (ADR-0304/0305, standing requirement 2). These tests click a control
  # for real and assert `getBoundingClientRect()` CHANGED — the only assertions in the suite that
  # can tell a working ⛶ from one that merely flips a class and a label. They are
  # `importorskip("playwright")`-gated, so without a browser they SKIP, and a tree whose ⛶ has been
  # re-inerted stays green. That was measured, not supposed: the round-11 adjudicator ran the same
  # broken tree both ways — 23 passed WITH playwright (regression caught), 21 passed / 2 skipped
  # WITHOUT it (regression invisible). A requirement enforced only by a test that never executes is
  # the exact round-10 failure class this ADR pair exists to retire.
  #
  # Deliberately a SEPARATE job, not a step in the `test` matrix: a browser adds ~1 min and a
  # download to every matrix cell, and this project has several documented render flakes
  # (/analysis's Gantt svg width, /curves' unsettled heights, /trend's bimodal jarvis captions).
  # Isolating it keeps a browser hiccup attributable instead of failing the Python gate, and it is
  # NOT in `check`'s `needs` for the same reason — promote it once it has a track record.
  browser:
    name: browser (measured-box proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (package + dev toolchain + browser)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium

      - name: The control must move a measured box
        run: pytest -q tests/web/test_r11_panel_contract.py -p no:cacheprovider

      # A skip here is a FAILURE, not a pass. Deliberately matches ANY skip rather than a reason
      # string: the first version of this guard grepped only for "playwright not installed" and
      # went green in 59s while all three rect tests skipped for a DIFFERENT reason (a hardcoded
      # vendored-chromium path that does not exist on a runner). Enumerating skip reasons is the
      # same mistake as enumerating failure modes — assert the property you actually want, which
      # is that nothing in this module skipped at all.
      - name: Fail loudly if the proof silently skipped
        run: |
          pytest -q tests/web/test_r11_panel_contract.py -p no:cacheprovider -rs 2>&1 | tee out.txt
          if grep -qE "^SKIPPED|[0-9]+ skipped" out.txt; then
            echo "::error::the measured-box tests SKIPPED — the ADR-0304/0305 proof did not run"
            grep -E "^SKIPPED" out.txt || true
            exit 1
          fi

  # Stable aggregate status (named "check") so branch protection has a single
  # context to require regardless of the matrix dimensions.
  check:
    name: check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix jobs passed"
